# Demo af skabelonen til Veyros egen brug (varebestilling-demo.<konto>.workers.dev).
# Bruges af Cloudflare Workers Builds med deploy-kommandoen:
#   npx wrangler deploy --config wrangler.demo.toml
# Kopiér IKKE denne fil til kunder – brug wrangler.toml (se README).
name = "varebestilling-demo"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "varebestilling-demo"
database_id = "d5a04c28-cb6b-415f-b70c-07a762478358"
migrations_dir = "migrations"

[triggers]
crons = ["23 3 * * *"]

# Uden RESEND_API_KEY sendes ingen e-mails; DEV_MODE viser login-linket direkte på skærmen.
# Tom APP_URL giver relative links, så demoen virker på den adresse, den ligger på.
[vars]
APP_URL = ""
ADMIN_EMAILS = "marcus@veyro.dk,kontakt@veyro.dk,efe@veyro.dk"
EMAIL_FROM = ""
DEV_MODE = "1"

[previews.vars]
APP_URL = ""
ADMIN_EMAILS = "marcus@veyro.dk,kontakt@veyro.dk,efe@veyro.dk"
EMAIL_FROM = ""
DEV_MODE = "1"

[[previews.d1_databases]]
binding = "DB"
database_name = "varebestilling-demo"
database_id = "d5a04c28-cb6b-415f-b70c-07a762478358"
