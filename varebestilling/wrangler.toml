# Cloudflare Worker-konfiguration for én kundes bestillingssystem.
# Kopiér skabelonen pr. kunde og udfyld felterne markeret med UDFYLD (se README).
name = "varebestilling" # UDFYLD: fx "bageriet-bestilling" (små bogstaver og bindestreger)
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# Eget domæne, fx bestil.kundensdomæne.dk (domænet skal ligge i samme Cloudflare-konto).
# Fjern kommentaren, når domænet er klar:
# routes = [
#   { pattern = "bestil.UDFYLD.dk", custom_domain = true }
# ]

[observability]
enabled = true

# D1-database. Udskift database_id med det ID, du får fra:
#   npx wrangler d1 create UDFYLD-kundenavn-bestilling
[[d1_databases]]
binding = "DB"
database_name = "varebestilling"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Daglig oprydning af udløbne login-links og sessioner (kl. 03:23 UTC)
[triggers]
crons = ["23 3 * * *"]

# Offentlige (ikke-hemmelige) indstillinger.
# RESEND_API_KEY sættes med `npx wrangler secret put RESEND_API_KEY` – aldrig her.
# Butikkens navn, farve, levering m.m. sættes i /admin/indstillinger.
[vars]
APP_URL = "https://bestil.UDFYLD.dk"
ADMIN_EMAILS = "UDFYLD@kunde.dk"
EMAIL_FROM = "UDFYLD Butik <ordre@UDFYLD.dk>"
DEV_MODE = "0"
