name = "veyro-webmail"
main = "worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "mail.veyro.dk", custom_domain = true }
]

[dev]
host = "localhost"

[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = false

[vars]
# Enable after verifying public TLS and the mailbox login on post.veyro.dk.
WEBMAIL_ENABLED = "1"
