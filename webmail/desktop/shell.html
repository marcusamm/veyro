<!doctype html>
<html lang="da">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyro Mail</title><link rel="stylesheet" href="shell.css"></head>
<body>
  <aside class="rail" aria-label="Veyro Mail">
    <img class="brand" src="logo.svg" alt="Veyro" width="40" height="40">
    <nav class="sections" aria-label="Arbejdsområder">
      <button data-section="mail" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><span>Mail</span></button>
      <button data-section="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l1.5-4A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8 10h8M8 14h5"/></svg><span>Chat</span></button>
      <button data-section="intranet"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Intranet</span></button>
    </nav>
    <div class="account-divider"><span>Konti</span></div>
    <nav id="accounts" aria-label="Skift mailkonto"></nav>
    <button id="add" class="add" title="Tilføj konto" aria-label="Tilføj konto">+</button>
    <button id="manage" class="manage" title="Administrer konto" aria-label="Administrer konto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button>
    <span class="rail-foot">Veyro Mail</span>
  </aside>
  <main id="stage" class="stage">
    <div id="status" class="status" role="status" aria-live="polite"><span class="status-mark">v<span>·</span></span><h1 id="status-title">Din mail. Dit overblik.</h1><p id="status-copy">Forbinder til din konto…</p><button id="retry" class="primary" hidden>Prøv igen</button><button id="first-account" class="primary" hidden>Tilføj en konto</button></div>
    <dialog id="account-dialog" aria-labelledby="dialog-title">
      <form id="account-form">
        <div class="dialog-top"><span class="eyebrow">Plads til alle dine konti</span><button type="button" id="close-dialog" class="close" aria-label="Luk">×</button></div>
        <h1 id="dialog-title">Tilføj en konto.</h1>
        <p id="dialog-copy">Skift mellem dine mailkonti med et enkelt klik.</p>
        <label for="label">Kontonavn</label><input id="label" name="label" maxlength="64" required placeholder="Fx arbejde eller privat" autocomplete="off">
        <fieldset id="kind-field"><legend>Mailtjeneste</legend><label class="choice"><input type="radio" name="kind" value="veyro" checked><span><strong>Veyro</strong><small>Mail, teamchat og intranet</small></span></label><label class="choice"><input type="radio" name="kind" value="external"><span><strong>En anden mailtjeneste</strong><small>Forbind med IMAP og SMTP</small></span></label></fieldset>
        <p id="form-error" class="error" role="alert"></p>
        <div class="dialog-actions"><button type="button" id="remove" class="danger" hidden>Fjern fra computeren</button><button type="submit" id="save" class="primary">Tilføj konto</button></div>
      </form>
    </dialog>
  </main>
  <div id="toast" role="status" hidden><span id="toast-text"></span><button id="dismiss-toast" aria-label="Luk besked">×</button></div>
  <script src="shell.js"></script>
</body></html>
