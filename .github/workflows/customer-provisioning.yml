name: Provision complimentary customer
on:
  push:
    branches: [main]
    paths:
      - 'scripts/customer-provisioning.mjs'
      - 'ops/customer-provisioning.sealed.json'
      - '.github/workflows/customer-provisioning.yml'
permissions:
  contents: read
concurrency:
  group: customer-provisioning
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision and verify without billing or notifications
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/customer-provisioning.mjs ops/customer-provisioning.sealed.json
