# Deployer alle kundeinstallationer i kunder/*.json til Cloudflare.
# Kører, når main ændres (ny kunde eller ny kode i systemerne), eller manuelt fra fanen Actions.
# Admin på kunde.veyro.dk starter den også for én kunde, når der klikkes "Udrul tjenester" (GITHUB_DISPATCH_TOKEN).
name: Deploy kunder

on:
  push:
    branches: [main]
    paths:
      - 'kunder/**'
      - 'lagerstyring/**'
      - 'varebestilling/**'
      - 'scripts/deploy-kunder.mjs'
      - '.github/workflows/deploy-kunder.yml'
  workflow_dispatch:
    inputs:
      kunde:
        description: 'Kun denne kunde (filnavnet uden .json). Tom = alle.'
        required: false
        default: ''

concurrency:
  group: deploy-kunder
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tjek kundefiler
        run: node scripts/deploy-kunder.mjs --dry-run > /dev/null
      - name: Installér og typecheck
        run: |
          for system in lagerstyring varebestilling; do
            (cd "$system" && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci && npm run typecheck)
          done
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM_STANDARD: ${{ vars.EMAIL_FROM_STANDARD || 'Veyro <login@veyro.dk>' }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN || 'marcus-ammitzboell' }}
          KUNDE_DOMAENE: ${{ vars.KUNDE_DOMAENE || 'veyro.dk' }}
          KUNDEKATALOG_ID: ${{ vars.KUNDEKATALOG_ID }}
          # Kunder oprettet i admin (kunde.veyro.dk › Kunder). Uden de to værdier bruges kun kunder/*.json.
          VEYRO_PROVISIONERING_URL: ${{ vars.VEYRO_PROVISIONERING_URL }}
          VEYRO_PROVISIONERING_TOKEN: ${{ secrets.VEYRO_PROVISIONERING_TOKEN }}
          KUNDE: ${{ inputs.kunde }}
        run: node scripts/deploy-kunder.mjs $KUNDE
      - name: Tjek kundeadresser i DNS
        if: always()
        env:
          KUNDE_DOMAENE: ${{ vars.KUNDE_DOMAENE || 'veyro.dk' }}
        run: |
          echo "Navneservere for $KUNDE_DOMAENE:"; dig +short NS "$KUNDE_DOMAENE"
          for adr in $(node -e "for (const f of require('fs').readdirSync('kunder').filter((f) => f.endsWith('.json'))) console.log(JSON.parse(require('fs').readFileSync('kunder/' + f)).adresse ?? f.replace('.json', ''))"); do
            echo "$adr.$KUNDE_DOMAENE: $(dig +short "$adr.$KUNDE_DOMAENE" @1.1.1.1 | tr '\n' ' ')"
          done
