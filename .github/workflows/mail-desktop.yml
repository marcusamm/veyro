name: Veyro Mail desktop installers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'webmail/desktop/**'
      - '.github/workflows/mail-desktop.yml'

permissions:
  contents: read

jobs:
  installers:
    name: ${{ matrix.platform }} ${{ matrix.arch }} prerelease
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            target: dmg
          - os: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
          - os: windows-2022
            platform: win
            arch: x64
            target: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: webmail/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webmail/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:smoke
      - name: Build installer without publishing
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.target }} --${{ matrix.arch }} --publish never
      - run: npm run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: Veyro-Mail-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
          path: |
            webmail/desktop/dist/*.dmg
            webmail/desktop/dist/*.exe
            webmail/desktop/dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: ignore
          path: webmail/desktop/.test-output/
