# Henter frit licenserede billedkandidater til UrmagerMette-demoen og lægger dem på grenen.
# Midlertidigt hjælpeworkflow: kører kun på demoens udviklingsgren.
name: "UrmagerMette: billeder"

on:
  push:
    branches: ['claude/project-thread-h5ssqk']
    paths: ['urmagermette/billeder/hent.txt']

permissions:
  contents: write

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hent billeder
        run: |
          npm install --no-save --prefix /tmp/b sharp@0.34.4
          export NODE_PATH=/tmp/b/node_modules
          cp urmagermette/scripts/*.mjs /tmp/b/
          if [ -s urmagermette/billeder/valgte.json ]; then
            node /tmp/b/hent-valgte-billeder.mjs
          else
            node /tmp/b/hent-billedkandidater.mjs "$PWD/urmagermette/billeder/_kandidater"
          fi
      - name: Læg billederne på grenen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A urmagermette/billeder urmagermette/public urmagermette/src/app/billedkilder.json
          git commit -m "UrmagerMette: billeder hentet af workflow" || exit 0
          git pull --rebase origin claude/project-thread-h5ssqk && git push
