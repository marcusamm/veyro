name: Veyro Mail iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build and test on an available iPhone
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          project=(-project VeyroMail.xcodeproj -scheme VeyroMail -configuration Debug)
          xcodebuild -version
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          find_runtime() {
            xcrun simctl list runtimes --json | jq -r --arg sdk "$sdk" '
              [.runtimes[] | select(.isAvailable and (.name | startswith("iOS ")))
                | select((.version | split(".")[0]) == ($sdk | split(".")[0]))
                | select((.version | split(".")[:2] | map(tonumber)) <= ($sdk | split(".")[:2] | map(tonumber)))]
              | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty'
          }
          runtime=$(find_runtime)
          if [[ -z "$runtime" ]]; then
            xcodebuild -downloadPlatform iOS
            runtime=$(find_runtime)
          fi
          test -n "$runtime"
          simulator=$(xcrun simctl list devices available --json | jq -r --arg runtime "$runtime" '
            first(.devices[$runtime][]? | select(.name | startswith("iPhone")) | .udid) // empty')
          if [[ -z "$simulator" ]]; then
            simulator=$(xcrun simctl create VeyroMailTest com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          fi
          xcrun simctl bootstatus "$simulator" -b
          xcodebuild "${project[@]}" \
            -destination "platform=iOS Simulator,id=$simulator" \
            -derivedDataPath "$RUNNER_TEMP/VeyroMailBuild" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/VeyroMailTests.xcresult" \
            clean test

      - name: Export verified app screens
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/screen-attachments"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/VeyroMailTests.xcresult" --output-path "$dir"
          mkdir -p "$RUNNER_TEMP/VeyroMailArtifacts"
          for name in VeyroMail-Login VeyroMail-Indbakke; do
            screenshot=$(jq -er --arg name "$name" 'first(.[] | .attachments[] | select(.suggestedHumanReadableName | startswith($name)) | .exportedFileName)' "$dir/manifest.json")
            cp "$dir/$screenshot" "$RUNNER_TEMP/VeyroMailArtifacts/$name.png"
          done

      - name: Package the Xcode project
        run: git archive --format=zip --prefix=VeyroMail/ -o "$RUNNER_TEMP/VeyroMailArtifacts/VeyroMail-iPhone.zip" HEAD:ios

      - name: Save project and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Veyro-Mail-iPhone
          path: ${{ runner.temp }}/VeyroMailArtifacts/
          if-no-files-found: error
          retention-days: 7
