name: Udgiv Veyro Mail

on:
  push:
    branches: [main]
    paths:
      - 'webmail/**'
      - '.github/workflows/deploy-webmail.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-veyro-webmail
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx tsc -p webmail/tsconfig.json
      - run: npx vitest run --config webmail/vitest.config.mjs
      - name: Udgiv webmail
        run: npx wrangler deploy --config webmail/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Kontrollér den offentlige webmail
        run: |
          base=https://mail.veyro.dk
          page="$RUNNER_TEMP/webmail.html"
          mode=$(python3 -c 'import tomllib; print(tomllib.load(open("webmail/wrangler.toml", "rb"))["vars"]["WEBMAIL_ENABLED"])')
          fetch=(curl --silent --show-error --connect-timeout 5 --max-time 20)

          check_entry() {
            local result
            result=$("${fetch[@]}" -o "$page" -w '%{http_code} %{redirect_url}' "$base/") || return 1
            if [[ "$mode" == 1 ]]; then
              [[ "$result" == "302 $base/SOGo/" ]] || return 1
              "${fetch[@]}" --location --proto-redir '=https' --max-redirs 5 --fail "$base/SOGo/" -o "$page" || return 1
              grep -Fq 'loginContent' "$page"
            else
              [[ "$result" == "200 " ]] && grep -Fq '/forhaandsvisning.js' "$page" || return 1
              [[ "$("${fetch[@]}" -o /dev/null -w '%{http_code}' "$base/SOGo/")" == 503 ]]
            fi
          }

          [[ "$mode" == 0 || "$mode" == 1 ]]
          for attempt in {1..12}; do
            if check_entry; then break; fi
            if [[ "$attempt" == 12 ]]; then echo "Forsiden svarede forkert for WEBMAIL_ENABLED=$mode"; exit 1; fi
            sleep 5
          done
          "${fetch[@]}" --fail "$base/forhaandsvisning" -o "$page"
          grep -Fq '/forhaandsvisning.js' "$page"
          for asset in forhaandsvisning.js forhaandsvisning.css sogo-theme.css webmail.css favicon.svg manrope.woff2; do
            [[ "$("${fetch[@]}" -o "$page" -w '%{http_code}' "$base/$asset")" == 200 && -s "$page" ]] || { echo "Mangler $asset"; exit 1; }
          done
