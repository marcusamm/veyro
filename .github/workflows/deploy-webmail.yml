name: Udgiv Veyro Mail

on:
  push:
    branches: [main]
    paths:
      - 'webmail/**'
      - '.github/workflows/deploy-webmail.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-veyro-webmail
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx tsc -p webmail/tsconfig.json
      - run: npx vitest run --config webmail/vitest.config.mjs
      - name: Udgiv webmail
        run: npx wrangler deploy --config webmail/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Kontrollér den offentlige webmail
        run: |
          base=https://mail.veyro.dk
          page="$RUNNER_TEMP/webmail.html"
          mode=$(node -e 'const { unstable_readConfig } = require("wrangler"); console.log(unstable_readConfig({ config: "webmail/wrangler.toml" }).vars.WEBMAIL_ENABLED)')
          fetch=(curl --silent --show-error --connect-timeout 5 --max-time 20)

          check_entry() {
            local result path
            result=$("${fetch[@]}" -H 'Accept: text/html' -o "$page" -w '%{http_code}' "$base/") || return 1
            if [[ "$mode" == 0 ]]; then
              [[ "$result" == 503 ]]
              return
            fi
            [[ "$result" == 200 ]] && grep -Fq '<title>Veyro Mail</title>' "$page" && grep -Fq 'src="/inbox.js"' "$page" || return 1
            grep -Fq 'id="password-form"' "$page" || return 1
            grep -Fq 'id="forgot-password"' "$page" && grep -Fq 'id="recovery-form"' "$page" || return 1
            result=$("${fetch[@]}" -o /dev/null -w '%{http_code}' "$base/api/password") || return 1
            [[ "$result" == 405 ]] || return 1
            result=$("${fetch[@]}" -o /dev/null -w '%{http_code}' "$base/api/recovery/request") || return 1
            [[ "$result" == 405 ]] || return 1
            for path in /forhaandsvisning /forhaandsvisning/ /SOGo/ /SOGo/so/; do
              result=$("${fetch[@]}" -o "$page" -w '%{http_code} %{redirect_url}' "$base$path") || return 1
              [[ "$result" == "308 $base/" ]] || return 1
            done
            result=$("${fetch[@]}" -o "$page" -w '%{http_code} %{content_type}' "$base/api/session") || return 1
            [[ "$result" == '401 application/json'* ]] && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$page"
          }

          [[ "$mode" == 0 || "$mode" == 1 ]]
          for attempt in {1..12}; do
            if check_entry; then break; fi
            if [[ "$attempt" == 12 ]]; then echo "Forsiden svarede forkert for WEBMAIL_ENABLED=$mode"; exit 1; fi
            sleep 5
          done
          for asset in forhaandsvisning.js forhaandsvisning.css; do
            [[ "$("${fetch[@]}" -o /dev/null -w '%{http_code}' "$base/$asset")" == 404 ]] || { echo "$asset er stadig offentligt"; exit 1; }
          done
          for asset in inbox.js inbox.css webmail.css favicon.svg manrope.woff2; do
            [[ "$("${fetch[@]}" -o "$page" -w '%{http_code}' "$base/$asset")" == 200 && -s "$page" ]] || { echo "Mangler $asset"; exit 1; }
          done
