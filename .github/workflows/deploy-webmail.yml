name: Udgiv Veyro Mail

on:
  push:
    branches: [main]
    paths:
      - 'webmail/**'
      - '.github/workflows/deploy-webmail.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-veyro-webmail
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx tsc -p webmail/tsconfig.json
      - run: npx vitest run --config webmail/vitest.config.mjs
      - name: Udgiv webmail
        run: npx wrangler deploy --config webmail/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Kontrollér den offentlige webmail
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 https://mail.veyro.dk/ -o "$RUNNER_TEMP/webmail.html"
          grep -Fq 'Veyro Mail' "$RUNNER_TEMP/webmail.html"
          curl --fail --silent --show-error https://mail.veyro.dk/webmail.css -o /dev/null
