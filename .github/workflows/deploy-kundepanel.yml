# Opdaterer databasen og publicerer kundepanelet, salgssiden og logistikværktøjer.dk.
# Køres ved nye migrationer/logistik-assets/domæner på main eller manuelt fra Actions.
# Migrationerne tilføjer kun nye kolonner og tabeller; eksisterende data bevares.
# Tilbagerulning af databasen: se "Tilbagerulning" i loggen (D1 Time Travel-bogmærke fra før migrationerne).
name: Deploy kundepanel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['migrations/**', 'public/logistik/**', 'public/logistics-site/**', 'src/logistics-site.ts', 'wrangler.toml']

concurrency:
  group: deploy-kundepanel
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DB: veyro-kundepanel

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installér og typecheck
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
          npm run typecheck
          npm run build:site -- --check
      - name: Tilbagerulning (bogmærke fra før migrationerne)
        run: npx wrangler d1 time-travel info "$DB"
      - name: Migrationslog
        # Produktionsdatabasen blev oprettet uden wranglers migrationslog. Uden den forsøger
        # "migrations apply" at køre 0001 igen og stopper. Loggen oprettes med de migrationer,
        # der allerede er i databasen, så kun de manglende køres bagefter.
        run: |
          q() { npx wrangler d1 execute "$DB" --remote --json --command "$1" | jq -r '.[0].results[0].n'; }
          if [ "$(q "SELECT count(*) AS n FROM sqlite_master WHERE name = 'd1_migrations'")" = "0" ]; then
            done="('0001_initial.sql'), ('0002_error_log.sql'), ('0003_signup.sql')"
            if [ "$(q "SELECT count(*) AS n FROM sqlite_master WHERE name = 'offers'")" != "0" ]; then done="$done, ('0004_offers.sql')"; fi
            npx wrangler d1 execute "$DB" --remote --command "CREATE TABLE d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL); INSERT INTO d1_migrations (name) VALUES $done;"
            echo "Migrationslog oprettet: $done"
          else
            echo "Migrationslog findes allerede"
          fi
      - name: Migrationer
        run: npx wrangler d1 migrations apply "$DB" --remote
      - name: Deploy
        run: npx wrangler deploy
      - name: Tjek de publicerede sider
        run: |
          # Vælg dansk eksplicit: runnerens land må ikke ændre disse indholdstjek.
          check() {
            for i in $(seq 1 12); do
              code=$(curl -s --cookie 'veyro_language=da' -o /dev/null -w '%{http_code}' "$1" || true)
              if [ "$code" = "$2" ]; then echo "OK $code $1"; return 0; fi
              echo "Venter på $1 (fik $code)"; sleep 10
            done
            echo "::error::$1 svarede ikke $2"; return 1
          }
          check https://kunde.veyro.dk/login 200
          check https://kunde.veyro.dk/logistik/ 200
          check https://kunde.veyro.dk/logistik/login 200
          check https://kunde.veyro.dk/logistik/vaerktoejer/eoq/ 200
          check https://kunde.veyro.dk/logistik/api/calculations 401
          logistics=https://xn--logistikvrktjer-5lb32a.dk
          check "$logistics/" 200
          check "$logistics/vaerktoejer/eoq/" 200
          check "$logistics/mine/" 200
          check "$logistics/logistik/login" 200
          check "$logistics/logistik/api/calculations" 401
          check "$logistics/sitemap.xml" 200
          for host in logistikvaerktojer.dk www.logistikvaerktojer.dk www.xn--logistikvrktjer-5lb32a.dk; do
            check "https://$host/vaerktoejer/eoq/?test=redirect" 308
            destination=$(curl -s -o /dev/null -w '%{redirect_url}' "https://$host/vaerktoejer/eoq/?test=redirect")
            if [ "$destination" != "$logistics/vaerktoejer/eoq/?test=redirect" ]; then
              echo "::error::$host har forkert viderestilling"; exit 1
            fi
          done
          # Login fra start til slut: send e-mail-formularen med en adresse uden konto (ingen mail sendes)
          jar=$(mktemp)
          csrf=$(curl -s -c "$jar" https://kunde.veyro.dk/login | sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' | head -1)
          svar=$(curl -s -b "$jar" -o /tmp/login.html -w '%{http_code}' -H 'Origin: https://kunde.veyro.dk' \
            --data-urlencode "_csrf=$csrf" --data-urlencode "email=produktionstest+$(date +%s)@veyro.dk" https://kunde.veyro.dk/login)
          if [ "$svar" = "200" ] && grep -q 'Tjek din indbakke' /tmp/login.html; then echo "OK login-formularen"
          else echo "::error::Login-formularen på kunde.veyro.dk svarede $svar"; sed -n '1,40p' /tmp/login.html; exit 1; fi
          check https://ny.veyro.dk/ 200
          check https://ny.veyro.dk/pages/kontakt 200
          check https://ny.veyro.dk/cart 200
          check https://veyro.dk/en/ 200
          check https://veyro.dk/sv/ 301
          check https://veyro.se/ 200
          check https://veyro.se/pages/priser 200
          check https://veyro.se/pages/kontakt 200
          check https://veyro.se/sitemap.xml 200
          check https://www.veyro.se/ 301
          destination=$(curl -s -o /dev/null -w '%{redirect_url}' 'https://veyro.dk/sv/pages/priser?test=redirect')
          if [ "$destination" != 'https://veyro.se/pages/priser?test=redirect' ]; then
            echo '::error::Den gamle svenske adresse viderestiller forkert'; exit 1
          fi
          curl -fsS --cookie 'veyro_language=da' https://veyro.se/ -o /tmp/veyro-sv.html
          if grep -q 'lang="sv"' /tmp/veyro-sv.html && grep -q 'canonical" href="https://veyro.se/"' /tmp/veyro-sv.html && grep -q 'SEK' /tmp/veyro-sv.html; then
            echo 'OK svensk forside, canonical og SEK'
          else echo '::error::veyro.se mangler svensk indhold eller metadata'; exit 1; fi
          # Juridiske sider på veyro.dk med indholdet, kunderne accepterer i kundepanelet
          side() {
            check "$1" 200
            if curl -s --cookie 'veyro_language=da' "$1" | grep -q "$2"; then echo "OK indhold: $2"; else echo "::error::$1 mangler '$2'"; return 1; fi
          }
          side https://veyro.dk/pages/handelsbetingelser 'ingen fortrydelsesret'
          side https://veyro.dk/pages/databehandleraftale 'Bilag B: Underdatabehandlere'
          side https://veyro.dk/pages/sla '99,5 %'
          side https://veyro.dk/pages/privatlivspolitik 'Kundepanelet og jeres aftaler'
          side https://veyro.dk/pages/cookiepolitik '__Host-vk_session'
          side https://veyro.dk/ 'href="/pages/databehandleraftale"'
