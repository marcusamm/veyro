# Opdaterer databasen og publicerer kundepanelet og hjemmesiden (kunde.veyro.dk og ny.veyro.dk).
# Køres manuelt fra fanen Actions: "Deploy kundepanel" -> "Run workflow".
# Migrationerne tilføjer kun nye kolonner og tabeller; eksisterende data bevares.
# Tilbagerulning af databasen: se "Tilbagerulning" i loggen (D1 Time Travel-bogmærke fra før migrationerne).
name: Deploy kundepanel

on:
  workflow_dispatch:

concurrency:
  group: deploy-kundepanel
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DB: veyro-kundepanel

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installér og typecheck
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
          npm run typecheck
          npm run build:site -- --check
      - name: Tilbagerulning (bogmærke fra før migrationerne)
        run: npx wrangler d1 time-travel info "$DB"
      - name: Migrationslog
        # Produktionsdatabasen blev oprettet uden wranglers migrationslog. Uden den forsøger
        # "migrations apply" at køre 0001 igen og stopper. Loggen oprettes med de migrationer,
        # der allerede er i databasen, så kun de manglende køres bagefter.
        run: |
          q() { npx wrangler d1 execute "$DB" --remote --json --command "$1" | jq -r '.[0].results[0].n'; }
          if [ "$(q "SELECT count(*) AS n FROM sqlite_master WHERE name = 'd1_migrations'")" = "0" ]; then
            done="('0001_initial.sql'), ('0002_error_log.sql'), ('0003_signup.sql')"
            if [ "$(q "SELECT count(*) AS n FROM sqlite_master WHERE name = 'offers'")" != "0" ]; then done="$done, ('0004_offers.sql')"; fi
            npx wrangler d1 execute "$DB" --remote --command "CREATE TABLE d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL); INSERT INTO d1_migrations (name) VALUES $done;"
            echo "Migrationslog oprettet: $done"
          else
            echo "Migrationslog findes allerede"
          fi
      - name: Migrationer
        run: npx wrangler d1 migrations apply "$DB" --remote
      - name: Deploy
        run: npx wrangler deploy
      - name: Tjek de publicerede sider
        run: |
          check() {
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$1" || true)
              if [ "$code" = "$2" ]; then echo "OK $code $1"; return 0; fi
              echo "Venter på $1 (fik $code)"; sleep 10
            done
            echo "::error::$1 svarede ikke $2"; return 1
          }
          check https://kunde.veyro.dk/login 200
          # Login fra start til slut: send e-mail-formularen med en adresse uden konto (ingen mail sendes)
          jar=$(mktemp)
          csrf=$(curl -s -c "$jar" https://kunde.veyro.dk/login | sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' | head -1)
          svar=$(curl -s -b "$jar" -o /tmp/login.html -w '%{http_code}' -H 'Origin: https://kunde.veyro.dk' \
            --data-urlencode "_csrf=$csrf" --data-urlencode "email=produktionstest+$(date +%s)@veyro.dk" https://kunde.veyro.dk/login)
          if [ "$svar" = "200" ] && grep -q 'Tjek din indbakke' /tmp/login.html; then echo "OK login-formularen"
          else echo "::error::Login-formularen på kunde.veyro.dk svarede $svar"; sed -n '1,40p' /tmp/login.html; exit 1; fi
          check https://ny.veyro.dk/ 200
          check https://ny.veyro.dk/pages/kontakt 200
          check https://ny.veyro.dk/cart 200
          # Juridiske sider på veyro.dk med indholdet, kunderne accepterer i kundepanelet
          side() {
            check "$1" 200
            if curl -s "$1" | grep -q "$2"; then echo "OK indhold: $2"; else echo "::error::$1 mangler '$2'"; return 1; fi
          }
          side https://veyro.dk/pages/handelsbetingelser 'ingen fortrydelsesret'
          side https://veyro.dk/pages/databehandleraftale 'Bilag B: Underdatabehandlere'
          side https://veyro.dk/pages/sla '99,5 %'
          side https://veyro.dk/pages/privatlivspolitik 'Kundepanelet og jeres aftaler'
          side https://veyro.dk/pages/cookiepolitik '__Host-vk_session'
          side https://veyro.dk/ 'href="/pages/databehandleraftale"'
