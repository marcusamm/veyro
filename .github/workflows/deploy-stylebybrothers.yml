# Publicerer StyleByBrothers' hjemmeside (stylebybrothers/site) på sbb.veyro.dk.
# Kører ved push til main, der ændrer stylebybrothers/, og kan køres manuelt fra fanen Actions.
name: Deploy StyleByBrothers

on:
  push:
    branches: [main]
    paths:
      - 'stylebybrothers/**'
      - '.github/workflows/deploy-stylebybrothers.yml'
  workflow_dispatch:

concurrency:
  group: deploy-stylebybrothers
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installér og test bookingmotoren
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
          npx vitest run --root stylebybrothers
      - name: Deploy
        run: npx wrangler deploy --config stylebybrothers/wrangler.toml
      - name: Tjek siden
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://sbb.veyro.dk/ || true)
            if [ "$code" = "200" ]; then echo "OK 200 https://sbb.veyro.dk/"; exit 0; fi
            echo "Venter på https://sbb.veyro.dk/ (fik $code)"; sleep 10
          done
          echo "::error::https://sbb.veyro.dk/ svarede ikke 200"; exit 1
