# Publicerer StyleByBrothers' hjemmeside og bookingserver (stylebybrothers/) på sbb.veyro.dk.
# Kører ved push til main, der ændrer stylebybrothers/, og kan køres manuelt fra fanen Actions.
name: Deploy StyleByBrothers

on:
  push:
    branches: [main]
    paths:
      - 'stylebybrothers/**'
      - '.github/workflows/deploy-stylebybrothers.yml'
  workflow_dispatch:

concurrency:
  group: deploy-stylebybrothers
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installér og test bookingmotoren
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
          npx vitest run --root stylebybrothers
      - name: Deploy
        run: npx wrangler deploy --config stylebybrothers/wrangler.toml
      - name: E-mail-nøgle
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "::warning::RESEND_API_KEY mangler, der sendes ingen e-mails"; exit 0; fi
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config stylebybrothers/wrangler.toml
      - name: Tjek siden
        run: |
          for i in $(seq 1 18); do
            a=$(curl -s -o /dev/null -w '%{http_code}' https://sbb.veyro.dk/ || true)
            b=$(curl -s -o /dev/null -w '%{http_code}' https://sbb.veyro.dk/api/state || true)
            if [ "$a" = "200" ] && [ "$b" = "200" ]; then echo "OK: siden og bookingserveren svarer"; exit 0; fi
            echo "Venter (side $a, server $b)"; sleep 10
          done
          echo "::error::sbb.veyro.dk svarede ikke 200"; exit 1
