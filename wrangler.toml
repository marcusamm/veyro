# Cloudflare Worker-konfiguration for Veyro kundepanel (kunde.veyro.dk)
name = "veyro"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# Eget domæne (veyro.dk ligger i samme Cloudflare-konto).
# ny.veyro.dk viser den nye hjemmeside, før veyro.dk flyttes fra Shopify (se README, afsnit 15).
routes = [
  { pattern = "kunde.veyro.dk", custom_domain = true },
  { pattern = "ny.veyro.dk", custom_domain = true }
]

# Ingen persondata i logs ud over det nødvendige
[observability]
enabled = true

# D1-database. Udskift database_id med det ID, du får fra:
#   npx wrangler d1 create veyro-kundepanel
[[d1_databases]]
binding = "DB"
database_name = "veyro-kundepanel"
database_id = "0f56d7df-f658-4f26-b0a7-53ab048d120a"
migrations_dir = "migrations"

# Kundekatalog: hvilke kundesystemer (fx ek.veyro.dk) en e-mail har adgang til.
# Kundernes lagerstyring skriver til det (se scripts/deploy-kunder.mjs); Kundelogin slår op i det.
[[kv_namespaces]]
binding = "KATALOG"
id = "3c625abe4eca4137926bef27947a605f"

# Daglig oprydning af udløbne login-links, sessioner m.m. (kl. 03:17 UTC)
[triggers]
crons = ["17 3 * * *"]

# Offentlige (ikke-hemmelige) indstillinger.
# Hemmeligheder (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY)
# sættes med `npx wrangler secret put NAVN` – aldrig her.
[vars]
APP_URL = "https://kunde.veyro.dk"
PRICE_STARTER = "price_1URpraAjYluIQ8PhsKsFnLsj"
PRICE_BUSINESS = "price_1URprgAjYluIQ8PhsiV8ne5Y"
PRICE_PREMIUM = "price_1URpsIAjYluIQ8PhmsDKXI61"
MIN_MONTHS = "0"
ADMIN_EMAILS = "kontakt@veyro.dk,efe@veyro.dk,marcus@veyro.dk"
NOTIFY_EMAIL = "kontakt@veyro.dk"
EMAIL_FROM = "Veyro <kontakt@veyro.dk>"
DEV_MODE = "0"
# Salgshjemmesiden. veyro.dk og www.veyro.dk virker først, når domænet er flyttet fra Shopify (README, afsnit 15).
SITE_HOSTS = "veyro.dk,www.veyro.dk,ny.veyro.dk"
SITE_URL = "https://veyro.dk"
# Valgfri momssats (inkluderet i prisen), se README:
# STRIPE_TAX_RATE_ID = "txr_..."

# Previews (Cloudflare bygger en preview for hver gren, der ikke er main, med `npx wrangler preview`).
# Previews arver ikke indstillingerne ovenfor og bruger deres egen testdatabase, aldrig produktionens.
# Hemmeligheder (Stripe, Resend) er ikke sat for previews, så de kan ikke tage betaling eller sende e-mails.
[previews.vars]
APP_URL = ""
PRICE_STARTER = "price_1URpraAjYluIQ8PhsKsFnLsj"
PRICE_BUSINESS = "price_1URprgAjYluIQ8PhsiV8ne5Y"
PRICE_PREMIUM = "price_1URpsIAjYluIQ8PhmsDKXI61"
MIN_MONTHS = "0"
ADMIN_EMAILS = "kontakt@veyro.dk,efe@veyro.dk,marcus@veyro.dk"
NOTIFY_EMAIL = "kontakt@veyro.dk"
EMAIL_FROM = "Veyro <kontakt@veyro.dk>"
DEV_MODE = "0"

# Testdatabase til previews. Nye migrationer køres mod den med:
#   npx wrangler d1 migrations apply veyro-kundepanel-preview --remote --config wrangler.preview-migrations.toml
[[previews.d1_databases]]
binding = "DB"
database_name = "veyro-kundepanel-preview"
database_id = "5795b22b-c07b-4d1f-af9d-a7f8b857e005"
