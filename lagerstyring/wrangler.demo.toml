# Demo af lagerstyringen til Veyros egen brug (lagerstyring-demo.<konto>.workers.dev).
# Bruges af Cloudflare Workers Builds med rodmappe /lagerstyring og deploy-kommandoen:
#   npx wrangler deploy --config wrangler.demo.toml
# Kopiér IKKE denne fil til kunder – brug wrangler.toml (se README).
name = "lagerstyring-demo"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "lagerstyring-demo"
database_id = "034205d9-9a7d-4039-a0bf-d9401b6c1c71"
migrations_dir = "migrations"

# Ingen cron i demoen: gratisplanen tillader kun 5 cron-triggere i alt, og de bruges af kunderne.
# Demoen har ingen rigtige prisfiler eller e-mails at køre hver time.
[triggers]
crons = []

# Uden RESEND_API_KEY sendes ingen e-mails: de gemmes som "simuleret" i e-mail-loggen.
# DEMO_MODE giver login med ét klik som ejer eller medarbejder, eksempeldata og nulstilling.
# Tom APP_URL giver relative links, så demoen virker på den adresse, den ligger på.
[vars]
APP_URL = ""
ADMIN_EMAILS = "marcus@veyro.dk,kontakt@veyro.dk,efe@veyro.dk"
EMAIL_FROM = ""
DEV_MODE = "1"
DEMO_MODE = "1"
