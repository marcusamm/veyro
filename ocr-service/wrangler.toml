# Private service binding only. No public URL, routes, cron, or document storage.
name = "veyro-receipt-ocr"
main = "src/index.ts"
compatibility_date = "2026-10-29"
workers_dev = false
preview_urls = false

[observability]
enabled = false

[[containers]]
class_name = "ReceiptOcrContainer"
scheduling_policy = "durable_object"

[containers.images.ocr]
dockerfile = "./engine/Dockerfile"
build_context = "./engine"

[[durable_objects.bindings]]
name = "OCR_CONTAINER"
class_name = "ReceiptOcrContainer"

[[migrations]]
tag = "v1-receipt-ocr"
new_sqlite_classes = ["ReceiptOcrContainer"]
